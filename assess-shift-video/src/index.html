<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASSESS SHIFT — Intro film preview</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="ui">
  <button id="play" type="button">Play</button>
  <input id="t" type="range" min="0" step="0.0333" value="0" aria-label="Timeline">
  <span id="tl">0.0s</span>
  <label>Scene <select id="scene"></select></label>
  <label>Format <select id="fmt"><option value="vertical">1080×1920</option><option value="landscape">1920×1080</option></select></label>
  <label>Language <select id="lang"><option value="en">English</option><option value="ar">Arabic</option></select></label>
</div>
<div id="wrap"><div id="stage"></div></div>
<script type="module" src="film.js"></script>
</body>
</html>
